<svg xmlns="http://www.w3.org/2000/svg" width="680" height="756" viewBox="0 0 680 756" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One ticket, start to merge</title>
  <desc>A ticket's path through agent-progress: you describe the work, the orchestrator files a ticket, the dispatcher starts a builder in a worktree, a fresh agent reviews it and loops back for another round when over 750 lines were reworked, then the release fast-forwards main and the ticket is done once merged. Out-of-scope findings become low-priority tickets, and a SubagentStop hook adds token usage to the row.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="754" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">One ticket, start to merge</text>
  <text x="40" y="68" font-size="13" fill="#73726c">every step is a CLI command on the board</text>

  <g fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)">
    <path d="M260,144 L260,173"/>
    <path d="M260,228 L260,257"/>
    <path d="M260,312 L260,341"/>
    <path d="M260,396 L260,425"/>
    <path d="M260,480 L260,509"/>
    <path d="M260,564 L260,593"/>
    <path d="M260,648 L260,677"/>
    <path d="M150,538 L112,538 L112,454 L146,454"/>
  </g>
  <text x="270" y="248" font-size="11" fill="#73726c">you say go</text>
  <text x="270" y="584" font-size="11" fill="#73726c">no</text>
  <text x="131" y="531" font-size="11" fill="#73726c" text-anchor="middle">yes</text>
  <text x="104" y="500" font-size="11" fill="#73726c" text-anchor="end">next round</text>

  <path d="M370,370 L396,370 L396,442 L370,442 M396,406 L416,406" fill="none" stroke="#bfbdb0" stroke-width="1.2" stroke-dasharray="1.5 3" stroke-linecap="round" marker-end="url(#ah)"/>
  <path d="M370,466 L525,466 L525,508" fill="none" stroke="#bfbdb0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <rect x="150" y="92" width="220" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="260" y="115" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">You describe the work</text>
  <text x="260" y="132" font-size="12" fill="#5F5E5A" text-anchor="middle">a bug, a change, a feature</text>

  <rect x="150" y="176" width="220" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="260" y="199" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Orchestrator files a ticket</text>
  <text x="260" y="216" font-size="12" fill="#185FA5" text-anchor="middle">grilled until testable</text>

  <rect x="150" y="260" width="220" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="260" y="283" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Dispatcher starts a builder</text>
  <text x="260" y="300" font-size="12" fill="#185FA5" text-anchor="middle">one per free slot</text>

  <rect x="150" y="344" width="220" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="260" y="367" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Builder works in a worktree</text>
  <text x="260" y="384" font-size="12" fill="#854F0B" text-anchor="middle">claim · build · Handoff</text>

  <rect x="150" y="428" width="220" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="260" y="451" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">A fresh agent reviews it</text>
  <text x="260" y="468" font-size="12" fill="#854F0B" text-anchor="middle">tries to prove it wrong</text>

  <rect x="150" y="512" width="220" height="52" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="260" y="543" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Over 750 lines reworked?</text>

  <rect x="150" y="596" width="220" height="52" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="260" y="619" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Release fast-forwards main</text>
  <text x="260" y="636" font-size="12" fill="#3B6D11" text-anchor="middle">under the tracker's lock</text>

  <rect x="150" y="680" width="220" height="52" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="260" y="703" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Done means merged</text>
  <text x="260" y="720" font-size="12" fill="#3B6D11" text-anchor="middle">row closed, worktree removed</text>

  <rect x="420" y="380" width="210" height="52" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="525" y="403" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">SubagentStop hook</text>
  <text x="525" y="420" font-size="12" fill="#993C1D" text-anchor="middle">adds tokens to the row</text>

  <rect x="420" y="512" width="210" height="52" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="525" y="535" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Findings outside scope</text>
  <text x="525" y="552" font-size="12" fill="#5F5E5A" text-anchor="middle">filed as low-priority tickets</text>
</svg>
