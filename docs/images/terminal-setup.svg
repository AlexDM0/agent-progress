<svg xmlns="http://www.w3.org/2000/svg" width="680" height="332" viewBox="0 0 680 332" role="img">
  <title>Installing agent-progress</title>
  <desc>A macOS terminal window showing git clone and ./setup.sh: Bun found, dependencies installed and the agent-progress command linked, and both Claude skills linked.</desc>

  <rect x="0.5" y="0.5" width="679" height="331" rx="12" fill="#1C1C1E" stroke="#3A3A3C"/>
  <path d="M0.5,28.5 V12.5 A12,12 0 0 1 12.5,0.5 H667.5 A12,12 0 0 1 679.5,12.5 V28.5 Z" fill="#2A2A2C" stroke="#3A3A3C"/>
  <line x1="1" y1="28.5" x2="679" y2="28.5" stroke="#0E0E0F"/>
  <circle cx="20" cy="14.5" r="6" fill="#FF5F57"/>
  <circle cx="40" cy="14.5" r="6" fill="#FEBC2E"/>
  <circle cx="60" cy="14.5" r="6" fill="#28C840"/>
  <text x="340" y="18.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9a9a9a">agent-progress — zsh</text>

  <g font-family="Menlo,ui-monospace,Consolas,monospace" font-size="11" fill="#E6E6E6" xml:space="preserve" style="white-space:pre">
    <text x="15" y="56"><tspan fill="#8E8E93">$</tspan> <tspan fill="#FFFFFF">git clone https://github.com/AlexDM0/agent-progress.git &amp;&amp; cd agent-progress</tspan></text>
    <text x="15" y="74"><tspan fill="#8E8E93">$</tspan> <tspan fill="#FFFFFF">./setup.sh</tspan></text>

    <text x="15" y="110" font-weight="700" fill="#FFFFFF">1/3 Bun</text>
    <text x="15" y="128">&#160;&#160;<tspan fill="#32D74B">&#x2714;&#xFE0E;</tspan> bun 1.4.2 found (~/.bun/bin/bun)</text>

    <text x="15" y="164" font-weight="700" fill="#FFFFFF">2/3 Dependencies and the global agent-progress command (bun install, bun link)</text>
    <text x="15" y="182">&#160;&#160;<tspan fill="#32D74B">&#x2714;&#xFE0E;</tspan> dependencies installed (bun install in ~/agent-progress)</text>
    <text x="15" y="200">&#160;&#160;<tspan fill="#32D74B">&#x2714;&#xFE0E;</tspan> agent-progress is on your PATH (~/.bun/bin/agent-progress)</text>

    <text x="15" y="236" font-weight="700" fill="#FFFFFF">3/3 The agent-progress Claude skills</text>
    <text x="15" y="254">&#160;&#160;<tspan fill="#32D74B">&#x2714;&#xFE0E;</tspan> Skill linked: ~/.claude/skills/agent-progress → ~/agent-progress/skill</text>
    <text x="15" y="272">&#160;&#160;<tspan fill="#32D74B">&#x2714;&#xFE0E;</tspan> Skill linked: ~/.claude/skills/agent-progress-orchestrate → ~/agent-progress/skill-orchestrate</text>

    <text x="15" y="308"><tspan font-weight="700" fill="#FFFFFF">Tooling ready.</tspan> Next:&#160;&#160;<tspan fill="#FFFFFF">cd &lt;a repository&gt; &amp;&amp; agent-progress init</tspan></text>
  </g>
</svg>
