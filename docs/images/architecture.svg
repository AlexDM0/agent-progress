<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>One runner owns the board</title>
  <desc>You work through the Bridge in your browser, or an orchestrator session that runs agent-progress commands. Both reach the Overseer, the one runner, which decides every move in code: it launches product-owner, builder, reviewer and Assistant sessions, reads what they hand back through their Hatch, keeps the store in .agent-progress/, and hands each reviewed ticket to the Airlock, which gates the merge and lands it on main one at a time.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
    <marker id="ahl" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto">
      <path d="M8,0 L0,4.5 L8,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="538" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">One runner owns the board</text>
  <text x="40" y="68" font-size="13" fill="#73726c">so the board can never disagree with the work</text>

  <!-- connectors -->
  <g fill="none" stroke="#bfbdb0" stroke-width="1.6">
    <path d="M300,148 L300,162 L180,162 L180,176" marker-end="url(#ah)"/>
    <path d="M380,148 L380,162 L500,162 L500,176" marker-end="url(#ah)"/>
    <path d="M180,236 L180,264" marker-start="url(#ahl)" marker-end="url(#ah)"/>
    <path d="M500,236 L500,264" marker-end="url(#ah)"/>
    <path d="M109,324 L109,352" marker-start="url(#ahl)" marker-end="url(#ah)"/>
    <path d="M259,324 L259,352" marker-start="url(#ahl)" marker-end="url(#ah)"/>
    <path d="M409,324 L409,352" marker-start="url(#ahl)" marker-end="url(#ah)"/>
    <path d="M565,324 L565,352" marker-start="url(#ahl)" marker-end="url(#ah)"/>
    <path d="M40,296 L24,296 L24,472 L36,472" marker-end="url(#ah)"/>
    <path d="M409,412 L409,440" marker-end="url(#ah)"/>
    <path d="M520,472 L556,472" marker-end="url(#ah)"/>
  </g>
  <g font-size="11" fill="#73726c">
    <text x="190" y="254">live page · API</text>
    <text x="510" y="254">commands</text>
    <text x="419" y="430">merge queue</text>
    <text x="538" y="464" text-anchor="middle">lands</text>
  </g>

  <!-- band 1: who acts -->
  <rect x="270" y="92" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="340" y="125" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">You</text>

  <rect x="40" y="180" width="280" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="180" y="204" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Bridge</text>
  <text x="180" y="222" font-size="12" fill="#3B6D11" text-anchor="middle">your browser · board, decisions, chat</text>

  <rect x="360" y="180" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="500" y="204" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Orchestrator session</text>
  <text x="500" y="222" font-size="12" fill="#185FA5" text-anchor="middle">optional · agent-progress-orchestrate skill</text>

  <!-- band 2: the single writer -->
  <rect x="40" y="268" width="600" height="56" rx="8" fill="#FAECE7" stroke="#F3D2C5"/>
  <text x="340" y="292" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Overseer · agent-progress run</text>
  <text x="340" y="310" font-size="12" fill="#993C1D" text-anchor="middle">decides every move in code: slots, gates, review rounds, parking</text>

  <!-- band 3: the sessions it launches -->
  <rect x="40" y="356" width="138" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="109" y="380" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Product owner</text>
  <text x="109" y="398" font-size="12" fill="#854F0B" text-anchor="middle">files drafts</text>

  <rect x="190" y="356" width="138" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="259" y="380" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Builders</text>
  <text x="259" y="398" font-size="12" fill="#854F0B" text-anchor="middle">own worktree</text>

  <rect x="340" y="356" width="138" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="409" y="380" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Reviewers</text>
  <text x="409" y="398" font-size="12" fill="#854F0B" text-anchor="middle">fresh agent each round</text>

  <rect x="490" y="356" width="150" height="56" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="565" y="380" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Assistant</text>
  <text x="565" y="398" font-size="12" fill="#854F0B" text-anchor="middle">handles incidents</text>

  <!-- band 4: what it keeps and where work lands -->
  <rect x="40" y="444" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">
    <text x="150" y="468" font-size="14" font-weight="500" fill="#444441">.agent-progress/</text>
    <text x="150" y="486" font-size="11" fill="#5F5E5A">progress.json · tickets/*.md</text>
  </g>

  <rect x="300" y="444" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="410" y="468" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Airlock</text>
  <text x="410" y="486" font-size="12" fill="#185FA5" text-anchor="middle">gates each merge, one at a time</text>

  <rect x="560" y="444" width="80" height="56" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="600" y="477" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">main</text>
</svg>
