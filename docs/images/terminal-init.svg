<svg xmlns="http://www.w3.org/2000/svg" width="680" height="296" viewBox="0 0 680 296" role="img">
  <title>agent-progress init in a terminal</title>
  <desc>A macOS terminal running agent-progress init in an example repository, listing the tracker, brief, dashboard, gitignore entry, CLAUDE.md block, hooks, dispatcher workflow and worker agent it installs, then agent-progress open.</desc>

  <rect x="0.5" y="0.5" width="679" height="295" rx="12" fill="#1C1C1E" stroke="#3A3A3C"/>
  <path d="M0.5,28.5 V12.5 A12,12 0 0 1 12.5,0.5 H667.5 A12,12 0 0 1 679.5,12.5 V28.5 Z" fill="#2A2A2C" stroke="#3A3A3C"/>
  <line x1="1" y1="28.5" x2="679" y2="28.5" stroke="#0E0E0F"/>
  <circle cx="20" cy="14.5" r="6" fill="#FF5F57"/>
  <circle cx="40" cy="14.5" r="6" fill="#FEBC2E"/>
  <circle cx="60" cy="14.5" r="6" fill="#28C840"/>
  <text x="340" y="18.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9a9a9a">example-storefront — zsh</text>

  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#E6E6E6">
    <text x="16" y="56" fill="#8E8E93">$</text><text x="30.4" y="56">cd ~/code/example-storefront</text>
    <text x="16" y="74" fill="#8E8E93">$</text><text x="30.4" y="74">agent-progress init --project &quot;Example Storefront&quot;</text>
    <text x="16" y="92">Initialised agent-progress for &quot;Example Storefront&quot; in ~/code/example-storefront</text>
    <text x="30.4" y="110" fill="#8E8E93">tracker:</text><text x="124" y="110">.agent-progress/</text>
    <text x="30.4" y="128" fill="#8E8E93">brief:</text><text x="124" y="128">.agent-progress/agent-brief.md</text>
    <text x="30.4" y="146" fill="#8E8E93">dashboard:</text><text x="124" y="146">.agent-progress/progress.html</text>
    <text x="30.4" y="164" fill="#8E8E93">.gitignore:</text><text x="124" y="164">entry <tspan fill="#32D74B">added</tspan></text>
    <text x="30.4" y="182" fill="#8E8E93">CLAUDE.md:</text><text x="124" y="182"><tspan fill="#32D74B">updated</tspan> (<tspan fill="#32D74B">created</tspan>)</text>
    <text x="30.4" y="200" fill="#8E8E93">hooks:</text><text x="124" y="200">.claude/settings.local.json (<tspan fill="#32D74B">installed</tspan>)</text>
    <text x="30.4" y="218" fill="#8E8E93">workflow:</text><text x="124" y="218"><tspan fill="#32D74B">updated</tspan> (.claude/workflows/agent-progress-dispatch.js)</text>
    <text x="30.4" y="236" fill="#8E8E93">agent:</text><text x="124" y="236"><tspan fill="#32D74B">updated</tspan> (.claude/agents/agent-progress-worker.md)</text>
    <text x="16" y="254" fill="#8E8E93">$</text><text x="30.4" y="254">agent-progress open</text>
    <text x="16" y="272" fill="#8E8E93">$</text><rect x="30.4" y="261" width="7" height="14" fill="#E6E6E6" opacity="0.75"/>
  </g>
</svg>
